# Uvicorn + app logging: timestamped lines on stdout, which start.sh appends to data/logs/*.log.
version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s %(levelname)-7s %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  access:
    (): uvicorn.logging.AccessFormatter
    format: '%(asctime)s ACCESS  %(client_addr)s "%(request_line)s" %(status_code)s'
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors: false
handlers:
  default:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
  access:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout
loggers:
  uvicorn: {handlers: [default], level: INFO, propagate: false}
  uvicorn.error: {level: INFO}
  uvicorn.access: {handlers: [access], level: INFO, propagate: false}
  app: {handlers: [default], level: INFO, propagate: false}
  qwen: {handlers: [default], level: INFO, propagate: false}
root:
  handlers: [default]
  level: WARNING
